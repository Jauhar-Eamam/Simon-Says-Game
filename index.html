<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simon Says Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Simon Says Game</h1>

    <h2>Press any key to start the game</h2>
    <h2  class="userScore"></h2>
    <div class="outerBox">
        <div>
            <div class="innerBox red" type="button" ></div>
            <div class="innerBox yellow" type="button" ></div>
        </div>
        <div>
            <div class="innerBox green" type="button" ></div>
            <div class="innerBox purple" type="button" ></div>
        </div>
    </div>

    <h2 class="highScore"></h2>


    <script src="app.js"></script>
</body>
</html>
